<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids' Crochet Socks</title>
<meta name="description" content="How to crochet socks for kids: a pattern for three sizes and recommended supplies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6ef;
  --surface:#ffffff;
  --ink:#2b2420;
  --muted:#6f6259;
  --line:#e8ddd0;
  --accent:#c4552f;
  --accent-soft:#f6e1d6;
  --sage:#5f7a5c;
  --sage-soft:#e3ecdf;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1d1916;
    --surface:#272220;
    --ink:#f2ebe4;
    --muted:#b3a69b;
    --line:#3a332e;
    --accent:#e6825c;
    --accent-soft:#3d2a22;
    --sage:#9bb897;
    --sage-soft:#26301f;
  }
}
:root[data-theme="dark"]{
  --bg:#1d1916;
  --surface:#272220;
  --ink:#f2ebe4;
  --muted:#b3a69b;
  --line:#3a332e;
  --accent:#e6825c;
  --accent-soft:#3d2a22;
  --sage:#9bb897;
  --sage-soft:#26301f;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Nunito Sans",system-ui,sans-serif;
  font-size:17px;
  line-height:1.65;
}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header.top{
  border-bottom:1px solid var(--line);
  background:var(--surface);
  position:sticky;top:0;z-index:10;
}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px}
.brand{font-family:Fraunces,serif;font-weight:700;font-size:20px;text-decoration:none;color:var(--ink)}
.brand span{color:var(--accent)}
nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:15px;margin-left:20px}
nav a:hover{color:var(--accent)}
.hero{padding:64px 0 40px}
.hero h1{
  font-family:Fraunces,serif;font-weight:700;
  font-size:clamp(34px,6vw,56px);line-height:1.08;margin:0 0 18px;max-width:14ch;
}
.hero p{font-size:19px;color:var(--muted);max-width:56ch;margin:0 0 28px}
.facts{display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0;list-style:none}
.facts li{
  background:var(--sage-soft);color:var(--sage);font-weight:700;font-size:14px;
  padding:6px 14px;border-radius:999px;
}
.stripe{
  height:14px;margin:8px 0 0;
  background:repeating-linear-gradient(135deg,var(--accent) 0 10px,transparent 10px 20px);
  opacity:.35;
}
section{padding:56px 0;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
h2{font-family:Fraunces,serif;font-size:clamp(26px,4vw,36px);margin:0 0 10px;line-height:1.2}
.lead{color:var(--muted);margin:0 0 28px;max-width:62ch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;
}
.card h3{margin:0 0 8px;font-size:18px}
.card p{margin:0;color:var(--muted)}
.card ul{margin:8px 0 0;padding-left:20px}
.sizebar{
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;margin-bottom:24px;position:sticky;top:72px;z-index:5;
}
.sizebar strong{margin-right:6px}
.sizebar button{
  font:inherit;font-weight:700;font-size:15px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--ink);
  padding:7px 14px;border-radius:999px;
}
.sizebar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.v{
  font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:0 6px;border-radius:6px;white-space:nowrap;
}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-weight:700;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:0}
ol.steps>li{
  counter-increment:s;position:relative;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px 22px 22px 76px;margin-bottom:14px;
}
ol.steps>li::before{
  content:counter(s);position:absolute;left:22px;top:20px;
  width:36px;height:36px;border-radius:50%;
  background:var(--accent);color:#fff;font-weight:700;
  display:grid;place-items:center;font-family:Fraunces,serif;
}
ol.steps h3{margin:0 0 6px;font-size:19px}
ol.steps p{margin:0 0 8px}
ol.steps p:last-child{margin-bottom:0}
.row{
  display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;
  background:var(--bg);border-left:3px solid var(--sage);padding:8px 12px;margin:6px 0;border-radius:0 8px 8px 0;
}
.tip{
  background:var(--sage-soft);border-radius:var(--radius);padding:16px 20px;margin-top:20px;
}
.tip strong{color:var(--sage)}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.product{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;display:flex;flex-direction:column;gap:8px;
}
.product .tag{
  align-self:flex-start;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  color:var(--sage);background:var(--sage-soft);padding:3px 10px;border-radius:999px;
}
.product .tag.must{color:var(--accent);background:var(--accent-soft)}
.product h3{margin:4px 0 0;font-size:18px}
.product p{margin:0;color:var(--muted);font-size:15px}
.product .spec{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;font-weight:600}
.kit{
  margin-top:28px;background:var(--ink);color:var(--bg);border-radius:var(--radius);
  padding:28px;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center;
}
.kit h3{font-family:Fraunces,serif;font-size:26px;margin:0 0 8px}
.kit p{margin:0;opacity:.8}
.kit ul{margin:0;padding-left:20px}
footer{padding:36px 0 48px;color:var(--muted);font-size:14px}
@media (max-width:820px){
  .grid2,.kit{grid-template-columns:1fr}
  .products{grid-template-columns:1fr 1fr}
  nav{display:none}
}
@media (max-width:540px){
  .products{grid-template-columns:1fr}
  ol.steps>li{padding:64px 18px 18px}
  ol.steps>li::before{left:18px;top:18px}
  .sizebar{top:68px}
}
.product .spec{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.price{color:var(--accent);font-weight:700;white-space:nowrap}
.buy{font-weight:700;font-size:14px;text-decoration:none}
.buy:hover{text-decoration:underline}
.preview-banner{background:var(--accent);color:#fff;text-align:center;font-weight:700;font-size:14px;padding:8px 16px}
</style>
</head>
<body>

<div class="preview-banner" id="previewBanner" hidden>Draft preview. Visitors can't see these changes yet.</div>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#" id="brand"></a>
    <nav>
      <a href="#pasiruosimas" id="navPrep"></a>
      <a href="#instrukcija" id="navInstr"></a>
      <a href="#prekes" id="navProducts"></a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap hero">
    <h1 id="heroTitle"></h1>
    <p id="heroText"></p>
    <ul class="facts" id="facts"></ul>
  </div>
  <div class="stripe"></div>

  <section id="pasiruosimas">
    <div class="wrap">
      <h2 id="prepTitle"></h2>
      <p class="lead" id="prepLead"></p>
      <div class="tablebox">
        <table>
          <thead>
            <tr><th>Size</th><th>Age</th><th>Foot length</th><th id="sizeVarHead">Stitches per round</th><th>Yarn needed</th></tr>
          </thead>
          <tbody id="sizeTable"></tbody>
        </table>
      </div>
      <div class="grid2" style="margin-top:20px">
        <div class="card">
          <h3 id="gaugeTitle"></h3>
          <p id="gaugeText"></p>
        </div>
        <div class="card">
          <h3 id="abbrTitle"></h3>
          <ul id="abbreviations"></ul>
        </div>
      </div>
    </div>
  </section>

  <section id="instrukcija">
    <div class="wrap">
      <h2 id="instrTitle"></h2>
      <p class="lead" id="instrLead"></p>
      <div class="sizebar" role="group" aria-label="Size" id="sizebar"><strong>Size:</strong></div>
      <ol class="steps" id="steps"></ol>
      <div class="tip"><strong id="tipTitle"></strong> <span id="tipText"></span></div>
    </div>
  </section>

  <section id="prekes">
    <div class="wrap">
      <h2 id="productsTitle"></h2>
      <p class="lead" id="productsLead"></p>
      <div class="products" id="products"></div>
      <div class="kit">
        <div>
          <h3 id="kitTitle"></h3>
          <p id="kitText"></p>
        </div>
        <ul id="kitItems"></ul>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap" id="footer"></div>
</footer>

<script src="content.js"></script>
<script>
(function(){
  var data = window.SITE_CONTENT;
  var params = new URLSearchParams(location.search);
  if (params.has("perziura")) {
    try {
      var draft = localStorage.getItem("kojiniu-juodrastis");
      if (draft) {
        data = JSON.parse(draft);
        document.getElementById("previewBanner").hidden = false;
      }
    } catch(e) {}
  }
  if (!data) {
    document.querySelector("main").innerHTML = '<div class="wrap hero"><p>The page content could not be loaded.</p></div>';
    return;
  }

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }
  function text(id, value){ $(id).textContent = value || ""; }
  function safeUrl(u){
    u = String(u || "").trim();
    return /^https?:\/\//i.test(u) ? u : "";
  }

  var site = data.site || {};
  document.title = site.pageTitle || document.title;
  $("brand").innerHTML = esc(site.brand) + " <span>" + esc(site.brandAccent) + "</span>";
  text("heroTitle", site.heroTitle);
  text("heroText", site.heroText);
  $("facts").innerHTML = (site.facts || []).map(function(f){ return "<li>" + esc(f) + "</li>"; }).join("");
  text("footer", site.footer);

  var prep = data.prep || {};
  text("prepTitle", prep.title);
  text("navPrep", prep.title);
  text("prepLead", prep.lead);
  text("gaugeTitle", prep.gaugeTitle);
  text("gaugeText", prep.gaugeText);
  text("abbrTitle", prep.abbrTitle);
  $("abbreviations").innerHTML = (prep.abbreviations || []).map(function(a){
    return "<li><b>" + esc(a.term) + "</b> " + esc(a.text) + "</li>";
  }).join("");

  var sizes = data.sizes || [];
  var variables = data.variables || [];
  function varValue(key, sizeId){
    for (var i = 0; i < variables.length; i++) {
      if (variables[i].key === key) return (variables[i].values || {})[sizeId];
    }
    return undefined;
  }
  var nVar = variables.filter(function(v){ return v.key === "n"; })[0];
  if (nVar && nVar.label) text("sizeVarHead", nVar.label);
  $("sizeTable").innerHTML = sizes.map(function(s){
    var n = varValue("n", s.id);
    return "<tr><td>" + esc(s.id) + "</td><td>" + esc(s.age) + "</td><td>" + esc(s.foot) + "</td><td>" + esc(n == null ? "" : n) + "</td><td>" + esc(s.yarn) + "</td></tr>";
  }).join("");

  var instr = data.instructions || {};
  text("instrTitle", instr.title);
  text("navInstr", instr.title);
  text("instrLead", instr.lead);
  text("tipTitle", instr.tipTitle);
  text("tipText", instr.tipText);

  function fill(t, sizeId){
    return esc(t).replace(/\{(\w+)\}/g, function(m, key){
      var v = varValue(key, sizeId);
      return v == null || v === "" ? m : '<span class="v">' + esc(v) + "</span>";
    });
  }
  function renderSteps(sizeId){
    $("steps").innerHTML = (instr.steps || []).map(function(step){
      var body = (step.blocks || []).map(function(b){
        return b.type === "row"
          ? '<span class="row">' + fill(b.text, sizeId) + "</span>"
          : "<p>" + fill(b.text, sizeId) + "</p>";
      }).join("");
      return "<li><h3>" + esc(step.title) + "</h3>" + body + "</li>";
    }).join("");
  }

  var bar = $("sizebar");
  sizes.forEach(function(s){
    var b = document.createElement("button");
    b.type = "button";
    b.setAttribute("data-size", s.id);
    b.textContent = s.id + (s.age ? " · " + s.age : "");
    b.addEventListener("click", function(){ applySize(s.id); });
    bar.appendChild(b);
  });
  function applySize(id){
    renderSteps(id);
    bar.querySelectorAll("button").forEach(function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-size") === id ? "true" : "false");
    });
    try { localStorage.setItem("kojiniu-dydis", id); } catch(e) {}
  }
  var ids = sizes.map(function(s){ return s.id; });
  var start = data.defaultSize;
  try { start = localStorage.getItem("kojiniu-dydis") || start; } catch(e) {}
  if (ids.indexOf(start) < 0) start = ids.indexOf(data.defaultSize) >= 0 ? data.defaultSize : ids[0];
  if (start) applySize(start); else renderSteps("");

  var ps = data.productsSection || {};
  text("productsTitle", ps.title);
  text("navProducts", ps.title);
  text("productsLead", ps.lead);
  $("products").innerHTML = (data.products || []).map(function(p){
    var must = p.tag === "must";
    var url = safeUrl(p.url);
    var footer = '<div class="spec">' + esc(p.spec);
    if (p.price) footer += '<span class="price">' + esc(p.price) + "</span>";
    footer += "</div>";
    var link = url ? '<a class="buy" href="' + esc(url) + '" target="_blank" rel="noopener">View product</a>' : "";
    return '<article class="product"><span class="tag' + (must ? " must" : "") + '">' + (must ? "Essential" : "Nice to have") + "</span>" +
      "<h3>" + esc(p.name) + "</h3><p>" + esc(p.description) + "</p>" + footer + link + "</article>";
  }).join("");

  var kit = data.kit || {};
  text("kitTitle", kit.title);
  text("kitText", kit.text);
  $("kitItems").innerHTML = (kit.items || []).map(function(i){ return "<li>" + esc(i) + "</li>"; }).join("");
})();
</script>
</body>
</html>
