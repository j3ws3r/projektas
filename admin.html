<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Turinio valdymas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1ea;
  --surface:#ffffff;
  --ink:#2b2420;
  --muted:#6f6259;
  --line:#e3d8ca;
  --accent:#c4552f;
  --accent-soft:#f6e1d6;
  --ok:#3f7a3c;
  --ok-soft:#e1eedd;
  --err:#b3261e;
  --err-soft:#f9dedc;
  --field:#fffdfa;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1714;
    --surface:#25201d;
    --ink:#f2ebe4;
    --muted:#b3a69b;
    --line:#3a332e;
    --accent:#e6825c;
    --accent-soft:#3d2a22;
    --ok:#9bc996;
    --ok-soft:#22301f;
    --err:#f2a39c;
    --err-soft:#3d1f1c;
    --field:#1f1b18;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1714;
  --surface:#25201d;
  --ink:#f2ebe4;
  --muted:#b3a69b;
  --line:#3a332e;
  --accent:#e6825c;
  --accent-soft:#3d2a22;
  --ok:#9bc996;
  --ok-soft:#22301f;
  --err:#f2a39c;
  --err-soft:#3d1f1c;
  --field:#1f1b18;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}
a{color:var(--accent)}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
}
.topbar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-family:Fraunces,serif;font-size:19px;margin:0;margin-right:auto}
.status{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--ok-soft);color:var(--ok)}
.status.dirty{background:var(--accent-soft);color:var(--accent)}
.btn{
  font:inherit;font-weight:700;font-size:14px;cursor:pointer;border-radius:8px;
  padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:4px 9px;font-size:13px;font-weight:600}
.btn.danger{color:var(--err)}
.btn:disabled{opacity:.5;cursor:default}
.layout{max-width:1180px;margin:0 auto;padding:20px 16px 80px;display:grid;grid-template-columns:200px 1fr;gap:24px;align-items:start}
.side{position:sticky;top:76px;display:flex;flex-direction:column;gap:2px}
.side a{padding:7px 12px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600}
.side a:hover{background:var(--surface);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:20px;scroll-margin-top:80px}
.panel h2{font-family:Fraunces,serif;font-size:21px;margin:0 0 4px}
.panel .hint{color:var(--muted);margin:0 0 16px;font-size:14px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.f label{font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=password],input[type=url],select,textarea{
  font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;
}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.item{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--bg)}
.item>.head{display:flex;align-items:center;gap:6px;padding:8px 10px;cursor:pointer}
.item>.head .t{font-weight:700;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item>.head .n{color:var(--muted);font-size:13px;font-weight:700;min-width:22px}
.item>.body{padding:4px 12px 12px;border-top:1px solid var(--line)}
.item.closed>.body{display:none}
.strrow{display:flex;gap:6px;margin-bottom:6px}
.strrow input{flex:1}
.vartable{width:100%;border-collapse:collapse}
.vartable th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:6px}
.vartable td{padding:4px}
.vartable code{font-size:13px}
.tablewrap{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chips code{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px;font-size:13px;cursor:pointer;border:0;font-family:ui-monospace,Menlo,monospace}
.msg{border-radius:10px;padding:10px 14px;margin-bottom:16px;font-weight:600}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.msg.err{background:var(--err-soft);color:var(--err)}
.msg.info{background:var(--accent-soft);color:var(--accent)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.blocktype{width:auto;min-width:150px}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:static;flex-direction:row;flex-wrap:wrap}
  .cols,.cols3{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="in">
    <h1>Turinio valdymas</h1>
    <span class="status" id="status">Išsaugota</span>
    <button class="btn" id="previewBtn" type="button">Peržiūra</button>
    <button class="btn" id="downloadBtn" type="button">Atsisiųsti content.js</button>
    <button class="btn primary" id="saveBtn" type="button">Išsaugoti į GitHub</button>
  </div>
</div>

<div class="layout">
  <nav class="side">
    <a href="#p-github">GitHub</a>
    <a href="#p-site">Pagrindinis</a>
    <a href="#p-prep">Pasiruošimas</a>
    <a href="#p-sizes">Dydžiai</a>
    <a href="#p-vars">Kintamieji</a>
    <a href="#p-steps">Instrukcija</a>
    <a href="#p-products">Prekės</a>
    <a href="#p-kit">Rinkinys</a>
  </nav>
  <div>
    <div id="messages"></div>
    <div id="panels"></div>
  </div>
</div>

<script src="content.js"></script>
<script>
(function(){
  var DRAFT_KEY = "kojiniu-juodrastis";
  var GH_KEY = "kojiniu-admin-github";
  var TOKEN_KEY = "kojiniu-admin-token";

  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e) {} }
  function lsDel(k){ try { localStorage.removeItem(k); } catch(e) {} }
  function ssGet(k){ try { return sessionStorage.getItem(k); } catch(e) { return null; } }
  function ssSet(k, v){ try { sessionStorage.setItem(k, v); } catch(e) {} }

  var published = window.SITE_CONTENT ? clone(window.SITE_CONTENT) : null;
  var state = published ? clone(published) : { site:{facts:[]}, prep:{abbreviations:[]}, sizes:[], variables:[], instructions:{steps:[]}, productsSection:{}, products:[], kit:{items:[]} };
  var dirty = false;
  var openItems = {};

  var draftRaw = lsGet(DRAFT_KEY);
  if (draftRaw) {
    try {
      var d = JSON.parse(draftRaw);
      if (JSON.stringify(d) !== JSON.stringify(published)) {
        state = d;
        dirty = true;
        setTimeout(function(){
          message("info", "Įkeltas neišsaugotas juodraštis iš šios naršyklės. ", "Atmesti juodraštį", function(){
            state = clone(published);
            lsDel(DRAFT_KEY);
            setDirty(false);
            renderAll();
            clearMessages();
          });
        }, 0);
      }
    } catch(e) {}
  }

  var gh = { owner:"j3ws3r", repo:"projektas", branch:"main", path:"content.js", message:"Atnaujintas puslapio turinys" };
  try { Object.assign(gh, JSON.parse(lsGet(GH_KEY) || "{}")); } catch(e) {}
  var token = ssGet(TOKEN_KEY) || "";

  function el(tag, attrs, kids){
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === "text") n.textContent = attrs[k];
      else if (k === "class") n.className = attrs[k];
      else if (k.indexOf("on") === 0) n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }

  function setDirty(v){
    dirty = v;
    var s = document.getElementById("status");
    s.textContent = v ? "Yra neišsaugotų pakeitimų" : "Išsaugota";
    s.classList.toggle("dirty", v);
  }
  function changed(){
    lsSet(DRAFT_KEY, JSON.stringify(state));
    setDirty(true);
  }

  function clearMessages(){ document.getElementById("messages").innerHTML = ""; }
  function message(kind, txt, actionLabel, action){
    var box = document.getElementById("messages");
    box.innerHTML = "";
    var m = el("div", {class:"msg " + kind}, [txt]);
    if (actionLabel) m.appendChild(el("button", {class:"btn small", type:"button", text:actionLabel, onclick:action}));
    box.appendChild(m);
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function field(label, obj, key, opts){
    opts = opts || {};
    var input;
    if (opts.options) {
      input = el("select");
      opts.options.forEach(function(o){
        var op = el("option", {value:o[0], text:o[1]});
        if (obj[key] === o[0]) op.selected = true;
        input.appendChild(op);
      });
    } else if (opts.multiline) {
      input = el("textarea");
      input.value = obj[key] || "";
    } else {
      input = el("input", {type: opts.type || "text"});
      input.value = obj[key] == null ? "" : obj[key];
    }
    if (opts.placeholder) input.placeholder = opts.placeholder;
    input.addEventListener(opts.options ? "change" : "input", function(){
      obj[key] = input.value;
      if (opts.onInput) opts.onInput(input.value);
      changed();
    });
    if (opts.onChange) input.addEventListener("change", function(){ opts.onChange(input.value); });
    return el("div", {class:"f"}, [el("label", {text:label}), input]);
  }

  function stringList(label, arr, addLabel){
    var wrap = el("div", {class:"f"}, [el("label", {text:label})]);
    arr.forEach(function(v, i){
      var inp = el("input", {type:"text"});
      inp.value = v;
      inp.addEventListener("input", function(){ arr[i] = inp.value; changed(); });
      wrap.appendChild(el("div", {class:"strrow"}, [
        inp,
        el("button", {class:"btn small", type:"button", title:"Aukštyn", text:"↑", onclick:function(){ move(arr, i, -1); }}),
        el("button", {class:"btn small", type:"button", title:"Žemyn", text:"↓", onclick:function(){ move(arr, i, 1); }}),
        el("button", {class:"btn small danger", type:"button", text:"Šalinti", onclick:function(){ arr.splice(i, 1); changed(); renderAll(); }})
      ]));
    });
    wrap.appendChild(el("div", {class:"row-actions"}, [
      el("button", {class:"btn small", type:"button", text:addLabel || "+ Pridėti", onclick:function(){ arr.push(""); changed(); renderAll(); }})
    ]));
    return wrap;
  }

  function move(arr, i, dir){
    var j = i + dir;
    if (j < 0 || j >= arr.length) return;
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    changed();
    renderAll();
  }

  function listEditor(id, arr, titleOf, bodyOf, create, addLabel){
    var wrap = el("div");
    arr.forEach(function(item, i){
      var key = id + ":" + i;
      var isOpen = !!openItems[key];
      var titleEl = el("span", {class:"t", text: titleOf(item) || "(be pavadinimo)"});
      var box = el("div", {class:"item" + (isOpen ? "" : " closed")});
      var head = el("div", {class:"head", onclick:function(e){
        if (e.target.closest("button")) return;
        openItems[key] = !openItems[key];
        box.classList.toggle("closed", !openItems[key]);
      }}, [
        el("span", {class:"n", text:String(i + 1)}),
        titleEl,
        el("button", {class:"btn small", type:"button", title:"Aukštyn", text:"↑", onclick:function(){ swapOpen(id, i, i - 1); move(arr, i, -1); }}),
        el("button", {class:"btn small", type:"button", title:"Žemyn", text:"↓", onclick:function(){ swapOpen(id, i, i + 1); move(arr, i, 1); }}),
        el("button", {class:"btn small danger", type:"button", text:"Šalinti", onclick:function(){
          if (!confirm("Pašalinti „" + (titleOf(item) || "elementą") + "“?")) return;
          arr.splice(i, 1);
          shiftOpen(id, i);
          changed();
          renderAll();
        }})
      ]);
      var body = el("div", {class:"body"}, [bodyOf(item, function(){ titleEl.textContent = titleOf(item) || "(be pavadinimo)"; })]);
      box.appendChild(head);
      box.appendChild(body);
      wrap.appendChild(box);
    });
    wrap.appendChild(el("div", {class:"row-actions"}, [
      el("button", {class:"btn small", type:"button", text:addLabel, onclick:function(){
        arr.push(create());
        openItems[id + ":" + (arr.length - 1)] = true;
        changed();
        renderAll();
      }})
    ]));
    return wrap;
  }
  function swapOpen(id, i, j){
    var a = openItems[id + ":" + i], b = openItems[id + ":" + j];
    openItems[id + ":" + i] = b; openItems[id + ":" + j] = a;
  }
  function shiftOpen(id, removed){
    var next = {};
    Object.keys(openItems).forEach(function(k){
      var parts = k.split(":");
      var idx = Number(parts[parts.length - 1]);
      var base = parts.slice(0, -1).join(":");
      if (base !== id) { if (k.indexOf(id + ":") !== 0) next[k] = openItems[k]; return; }
      if (idx < removed) next[k] = openItems[k];
      else if (idx > removed) next[base + ":" + (idx - 1)] = openItems[k];
    });
    openItems = next;
  }

  function panel(id, title, hint, kids){
    return el("section", {class:"panel", id:id}, [el("h2", {text:title}), hint ? el("p", {class:"hint", text:hint}) : null].concat(kids));
  }

  function githubPanel(){
    function ghField(label, key, type){
      var inp = el("input", {type:type || "text"});
      inp.value = gh[key];
      inp.addEventListener("input", function(){ gh[key] = inp.value.trim(); lsSet(GH_KEY, JSON.stringify(gh)); });
      return el("div", {class:"f"}, [el("label", {text:label}), inp]);
    }
    var tok = el("input", {type:"password", autocomplete:"off", placeholder:"github_pat_..."});
    tok.value = token;
    tok.addEventListener("input", function(){ token = tok.value.trim(); ssSet(TOKEN_KEY, token); });
    var msgInp = el("input", {type:"text"});
    msgInp.value = gh.message;
    msgInp.addEventListener("input", function(){ gh.message = msgInp.value; lsSet(GH_KEY, JSON.stringify(gh)); });
    return panel("p-github", "GitHub", "Pakeitimai išsaugomi kaip commit'as į content.js failą repozitorijoje. Prieigos raktas laikomas tik šiame naršyklės skirtuke ir niekur kitur nesiunčiamas.", [
      el("div", {class:"cols3"}, [ghField("Savininkas", "owner"), ghField("Repozitorija", "repo"), ghField("Šaka", "branch")]),
      el("div", {class:"cols"}, [ghField("Failo kelias", "path"), el("div", {class:"f"}, [el("label", {text:"Commit žinutė"}), msgInp])]),
      el("div", {class:"f"}, [el("label", {text:"Prieigos raktas (fine-grained token su Contents: Read and write teise šiai repozitorijai)"}), tok]),
      el("div", {class:"row-actions"}, [el("button", {class:"btn", type:"button", text:"Įkelti naujausią turinį iš GitHub", onclick:loadFromGitHub})])
    ]);
  }

  function sitePanel(){
    var s = state.site = state.site || {};
    s.facts = s.facts || [];
    return panel("p-site", "Pagrindinis", "Puslapio viršus ir apačia.", [
      el("div", {class:"cols"}, [field("Naršyklės lango pavadinimas", s, "pageTitle"), el("div", {class:"cols"}, [field("Logotipas", s, "brand"), field("Logotipo paryškinta dalis", s, "brandAccent")])]),
      field("Antraštė", s, "heroTitle"),
      field("Įžanga", s, "heroText", {multiline:true}),
      stringList("Žymos po įžanga", s.facts, "+ Pridėti žymą"),
      field("Poraštė", s, "footer")
    ]);
  }

  function prepPanel(){
    var p = state.prep = state.prep || {};
    p.abbreviations = p.abbreviations || [];
    return panel("p-prep", "Pasiruošimas", null, [
      field("Skyriaus pavadinimas", p, "title"),
      field("Įžanga", p, "lead", {multiline:true}),
      el("div", {class:"cols"}, [field("Tankio kortelės antraštė", p, "gaugeTitle"), field("Sutrumpinimų kortelės antraštė", p, "abbrTitle")]),
      field("Tankio aprašymas", p, "gaugeText", {multiline:true}),
      el("div", {class:"f"}, [el("label", {text:"Sutrumpinimai"}), listEditor("abbr", p.abbreviations, function(a){ return a.term + (a.text ? ": " + a.text : ""); }, function(a, refresh){
        return el("div", {class:"cols"}, [field("Sutrumpinimas", a, "term", {onInput:refresh}), field("Reikšmė", a, "text", {onInput:refresh})]);
      }, function(){ return {term:"", text:""}; }, "+ Pridėti sutrumpinimą")])
    ]);
  }

  function renameSize(oldId, newId){
    if (!oldId || oldId === newId) return;
    (state.variables || []).forEach(function(v){
      v.values = v.values || {};
      if (Object.prototype.hasOwnProperty.call(v.values, oldId)) {
        v.values[newId] = v.values[oldId];
        delete v.values[oldId];
      }
    });
    if (state.defaultSize === oldId) state.defaultSize = newId;
    changed();
    renderAll();
  }

  function sizesPanel(){
    state.sizes = state.sizes || [];
    var opts = state.sizes.map(function(s){ return [s.id, s.id]; });
    return panel("p-sizes", "Dydžiai", "Kiekvienas dydis tampa mygtuku instrukcijoje ir eilute dydžių lentelėje. Akių skaičius lentelėje imamas iš kintamojo {n}.", [
      opts.length ? field("Numatytasis dydis", state, "defaultSize", {options:opts}) : null,
      listEditor("sizes", state.sizes, function(s){ return s.id + (s.age ? " · " + s.age : ""); }, function(s, refresh){
        var prev = s.id;
        return el("div", {}, [
          el("div", {class:"cols"}, [
            field("Žymėjimas (pvz. M)", s, "id", {onInput:refresh, onChange:function(v){ var old = prev; prev = v; renameSize(old, v); }}),
            field("Amžius", s, "age", {onInput:refresh})
          ]),
          el("div", {class:"cols"}, [field("Pėdos ilgis", s, "foot"), field("Siūlų kiekis", s, "yarn")])
        ]);
      }, function(){ return {id:"XL", age:"", foot:"", yarn:""}; }, "+ Pridėti dydį")
    ]);
  }

  function varsPanel(){
    state.variables = state.variables || [];
    var sizes = state.sizes || [];
    var table = el("table", {class:"vartable"});
    var headRow = el("tr", {}, [el("th", {text:"Raktas"}), el("th", {text:"Pavadinimas"})].concat(sizes.map(function(s){ return el("th", {text:s.id}); })).concat([el("th")]));
    table.appendChild(el("thead", {}, [headRow]));
    var tb = el("tbody");
    state.variables.forEach(function(v, i){
      v.values = v.values || {};
      function cell(obj, key, ph){
        var inp = el("input", {type:"text", placeholder:ph || ""});
        inp.value = obj[key] == null ? "" : obj[key];
        inp.addEventListener("input", function(){ obj[key] = key === "key" ? inp.value.replace(/[^\w]/g, "") : inp.value; if (key === "key" && inp.value !== obj[key]) inp.value = obj[key]; changed(); });
        return el("td", {}, [inp]);
      }
      tb.appendChild(el("tr", {}, [cell(v, "key", "raktas"), cell(v, "label")].concat(sizes.map(function(s){ return cell(v.values, s.id); })).concat([
        el("td", {}, [el("button", {class:"btn small danger", type:"button", text:"Šalinti", onclick:function(){ state.variables.splice(i, 1); changed(); renderAll(); }})])
      ])));
    });
    table.appendChild(tb);
    return panel("p-vars", "Kintamieji", "Instrukcijos tekste rašykite {raktas}, pavyzdžiui {n}, ir puslapyje bus įrašyta pasirinkto dydžio reikšmė. Raktas gali turėti tik raides, skaičius ir pabraukimą.", [
      el("div", {class:"tablewrap"}, [table]),
      el("div", {class:"row-actions"}, [el("button", {class:"btn small", type:"button", text:"+ Pridėti kintamąjį", onclick:function(){ state.variables.push({key:"", label:"", values:{}}); changed(); renderAll(); }})])
    ]);
  }

  function stepsPanel(){
    var ins = state.instructions = state.instructions || {};
    ins.steps = ins.steps || [];
    var keys = (state.variables || []).map(function(v){ return v.key; }).filter(Boolean);
    return panel("p-steps", "Instrukcija", null, [
      field("Skyriaus pavadinimas", ins, "title"),
      field("Įžanga", ins, "lead", {multiline:true}),
      el("div", {class:"f"}, [el("label", {text:"Žingsniai"}), listEditor("steps", ins.steps, function(s){ return s.title; }, function(step, refresh){
        step.blocks = step.blocks || [];
        var chips = el("div", {class:"chips"}, keys.map(function(k){ return el("code", {text:"{" + k + "}", title:"Kopijuoti", onclick:function(){ try { navigator.clipboard.writeText("{" + k + "}"); } catch(e) {} }}); }));
        return el("div", {}, [
          field("Žingsnio pavadinimas", step, "title", {onInput:refresh}),
          keys.length ? el("div", {class:"f"}, [el("label", {text:"Galimi kintamieji (spustelėkite, kad nukopijuotumėte)"}), chips]) : null,
          el("div", {class:"f"}, [el("label", {text:"Turinys"}), listEditor("steps:" + ins.steps.indexOf(step) + ":b", step.blocks, function(b){ return (b.type === "row" ? "Eilutė: " : "Tekstas: ") + (b.text || "").slice(0, 70); }, function(b, refresh2){
            return el("div", {}, [
              field("Tipas", b, "type", {options:[["p","Pastraipa"],["row","Nėrimo eilutė"]], onInput:refresh2}),
              field("Tekstas", b, "text", {multiline:true, onInput:refresh2})
            ]);
          }, function(){ return {type:"p", text:""}; }, "+ Pridėti bloką")])
        ]);
      }, function(){ return {title:"Naujas žingsnis", blocks:[{type:"p", text:""}]}; }, "+ Pridėti žingsnį")]),
      el("div", {class:"cols"}, [field("Patarimo antraštė", ins, "tipTitle"), field("Patarimo tekstas", ins, "tipText", {multiline:true})])
    ]);
  }

  function productsPanel(){
    var ps = state.productsSection = state.productsSection || {};
    state.products = state.products || [];
    return panel("p-products", "Prekės", "Kaina ir nuoroda neprivalomos. Nuoroda turi prasidėti https://.", [
      field("Skyriaus pavadinimas", ps, "title"),
      field("Įžanga", ps, "lead", {multiline:true}),
      listEditor("products", state.products, function(p){ return p.name + (p.tag === "must" ? " · būtina" : ""); }, function(p, refresh){
        return el("div", {}, [
          el("div", {class:"cols"}, [field("Pavadinimas", p, "name", {onInput:refresh}), field("Žyma", p, "tag", {options:[["must","Būtina"],["nice","Patogu"]], onInput:refresh})]),
          field("Aprašymas", p, "description", {multiline:true}),
          el("div", {class:"cols3"}, [field("Savybės", p, "spec"), field("Kaina", p, "price", {placeholder:"pvz. 6,90 €"}), field("Nuoroda į prekę", p, "url", {type:"url", placeholder:"https://"})])
        ]);
      }, function(){ return {tag:"nice", name:"", description:"", spec:"", price:"", url:""}; }, "+ Pridėti prekę")
    ]);
  }

  function kitPanel(){
    var k = state.kit = state.kit || {};
    k.items = k.items || [];
    return panel("p-kit", "Rinkinys", "Tamsus blokas prekių skyriaus apačioje.", [
      field("Pavadinimas", k, "title"),
      field("Aprašymas", k, "text", {multiline:true}),
      stringList("Sudėtis", k.items, "+ Pridėti eilutę")
    ]);
  }

  function renderAll(){
    var y = window.scrollY;
    var host = document.getElementById("panels");
    host.innerHTML = "";
    [githubPanel, sitePanel, prepPanel, sizesPanel, varsPanel, stepsPanel, productsPanel, kitPanel].forEach(function(fn){ host.appendChild(fn()); });
    window.scrollTo(0, y);
  }

  function serialize(){ return "window.SITE_CONTENT = " + JSON.stringify(state, null, 2) + ";\n"; }
  function parseContent(txt){ return JSON.parse(txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1)); }
  function toB64(str){
    var bytes = new TextEncoder().encode(str), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function fromB64(b64){
    var bin = atob(b64.replace(/\s/g, ""));
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function validate(){
    var errs = [];
    var ids = (state.sizes || []).map(function(s){ return (s.id || "").trim(); });
    if (!ids.length) errs.push("Turi būti bent vienas dydis.");
    if (ids.some(function(i){ return !i; })) errs.push("Kiekvienas dydis turi turėti žymėjimą.");
    if (new Set(ids).size !== ids.length) errs.push("Dydžių žymėjimai kartojasi.");
    var keys = (state.variables || []).map(function(v){ return v.key; });
    if (keys.some(function(k){ return !k; })) errs.push("Kiekvienas kintamasis turi turėti raktą.");
    if (new Set(keys).size !== keys.length) errs.push("Kintamųjų raktai kartojasi.");
    (state.products || []).forEach(function(p){
      if (p.url && !/^https?:\/\//i.test(p.url)) errs.push("Prekės „" + p.name + "“ nuoroda turi prasidėti https://.");
    });
    return errs;
  }

  function apiUrl(){
    return "https://api.github.com/repos/" + encodeURIComponent(gh.owner) + "/" + encodeURIComponent(gh.repo) + "/contents/" + gh.path.split("/").map(encodeURIComponent).join("/");
  }
  function headers(){
    return { "Authorization":"Bearer " + token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" };
  }
  function explain(res, body){
    if (res.status === 401) return "GitHub nepriėmė prieigos rakto. Patikrinkite, ar jis teisingas ir nepasibaigęs.";
    if (res.status === 403) return "Prieigos raktas neturi teisės rašyti į šią repozitoriją.";
    if (res.status === 404) return "Repozitorija, šaka ar failas nerasti. Patikrinkite GitHub nustatymus.";
    if (res.status === 409) return "Failas ką tik buvo pakeistas kitur. Įkelkite naujausią turinį ir bandykite dar kartą.";
    return "GitHub klaida " + res.status + (body && body.message ? ": " + body.message : "");
  }
  function getRemote(){
    return fetch(apiUrl() + "?ref=" + encodeURIComponent(gh.branch), {headers:headers(), cache:"no-store"}).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(body){
        if (!res.ok) throw new Error(explain(res, body));
        return body;
      });
    });
  }

  function loadFromGitHub(){
    if (!token) return message("err", "Įveskite prieigos raktą.");
    if (dirty && !confirm("Neišsaugoti pakeitimai bus pakeisti turiniu iš GitHub. Tęsti?")) return;
    getRemote().then(function(body){
      state = parseContent(fromB64(body.content));
      published = clone(state);
      lsDel(DRAFT_KEY);
      setDirty(false);
      renderAll();
      message("ok", "Turinys įkeltas iš GitHub.");
    }).catch(function(e){ message("err", e.message); });
  }

  function saveToGitHub(){
    var errs = validate();
    if (errs.length) return message("err", errs.join(" "));
    if (!token) {
      document.getElementById("p-github").scrollIntoView({behavior:"smooth"});
      return message("err", "Įveskite GitHub prieigos raktą skiltyje GitHub.");
    }
    var btn = document.getElementById("saveBtn");
    btn.disabled = true;
    btn.textContent = "Saugoma...";
    getRemote().catch(function(e){
      if (/nerasti/.test(e.message)) return {};
      throw e;
    }).then(function(remote){
      var payload = { message: gh.message || "Atnaujintas puslapio turinys", content: toB64(serialize()), branch: gh.branch };
      if (remote.sha) payload.sha = remote.sha;
      return fetch(apiUrl(), {method:"PUT", headers:Object.assign({"Content-Type":"application/json"}, headers()), body:JSON.stringify(payload)}).then(function(res){
        return res.json().catch(function(){ return {}; }).then(function(body){
          if (!res.ok) throw new Error(explain(res, body));
          return body;
        });
      });
    }).then(function(body){
      published = clone(state);
      lsDel(DRAFT_KEY);
      setDirty(false);
      var url = body.commit && body.commit.html_url;
      message("ok", "Išsaugota. Svetainėje pakeitimai pasirodys, kai ji bus perkurta iš repozitorijos (dažniausiai per minutę). ", url ? "Atidaryti commit'ą" : null, url ? function(){ window.open(url, "_blank", "noopener"); } : null);
    }).catch(function(e){
      message("err", e.message);
    }).then(function(){
      btn.disabled = false;
      btn.textContent = "Išsaugoti į GitHub";
    });
  }

  document.getElementById("saveBtn").addEventListener("click", saveToGitHub);
  document.getElementById("previewBtn").addEventListener("click", function(){
    lsSet(DRAFT_KEY, JSON.stringify(state));
    window.open("index.html?perziura=1", "_blank");
  });
  document.getElementById("downloadBtn").addEventListener("click", function(){
    var blob = new Blob([serialize()], {type:"text/javascript"});
    var a = el("a", {href:URL.createObjectURL(blob), download:"content.js"});
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });
  window.addEventListener("beforeunload", function(e){
    if (dirty) { e.preventDefault(); e.returnValue = ""; }
  });

  if (!published) message("err", "Nepavyko įkelti content.js. Įveskite GitHub duomenis ir spauskite „Įkelti naujausią turinį iš GitHub“.");
  setDirty(dirty);
  renderAll();
})();
</script>
</body>
</html>
